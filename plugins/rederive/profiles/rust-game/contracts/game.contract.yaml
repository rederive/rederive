# The INTENT CONTRACT for this build (typikon `contract`): the giver's requirements in the giver's OWN
# words, each satisfied by a named unit or glue. Quorum measures whether builders converged; this grades
# whether the decomposition KEPT the requirement. Ratification (`tools/typikon contract --ratify --by
# <name>`) is the giver's act. Replace the two placeholder requirements below with real ones, quoting the
# design doc section each comes from, before the first `--ratify`.
contract:
  id: game-v1
  giver: <name>
  requirements:
    - {id: R1, text: "<the giver's own words for the first rule, quoting the design doc section>", kind: domain, satisfied_by: <unit_name>}
    - {id: R2, text: "<the giver's own words for the second rule, quoting the design doc section>", kind: domain, satisfied_by: <unit_name>}
  units:
    - {name: <unit_name>, role: unit, computes: "<one line: what this unit computes, with a design-doc citation>"}
