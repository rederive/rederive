  <text x="90" y="372" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#f1eee7">rederive</text>
  <text x="92" y="444" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#f1eee7">Trust the code you didn&#8217;t write.</text>
