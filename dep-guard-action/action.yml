name: 'dep-guard'
description: 'Gate a PR on risky dependency ADDS (npm/pnpm) → green/yellow/red. Runs on your own infra, no data egress.'
author: 'rederive'
branding: { icon: 'shield', color: 'orange' }
inputs:
  rederive-version:
    description: 'Exact rederive (rdv) version to run the guard with, as `npx --yes rederive@<version>`. Pinned so the verifier cannot move under you.'
    default: '0.5.0'
  fail-closed:
    description: '"true" (default): if npx/rdv crashes or prints empty/invalid JSON, fail the check (exit 2). "false": emit a warning and pass.'
    default: 'true'
  rdv:
    description: 'Advanced: override the whole rdv invocation (e.g. a local build: `node ./dist/cli.cjs`). Empty = `npx --yes rederive@<rederive-version>`.'
    default: ''
runs:
  using: 'composite'
  steps:
    - name: dep-guard
      shell: bash
      env:
        DEPGUARD_RDV: ${{ inputs.rdv }}
        DEPGUARD_RDV_VERSION: ${{ inputs.rederive-version }}
        DEPGUARD_FAIL_CLOSED: ${{ inputs.fail-closed }}
        GITHUB_TOKEN: ${{ github.token }}   # raises the contributor-lookup rate limit (read-only; safe on forks)
      run: bash "${{ github.action_path }}/dep-guard.sh"
